<script>
/* ---------- HD payout wallet: one 12-word seed -> an address for every payout
   coin. Paths follow each ecosystem's convention (shown in the UI) so the same
   seed opens the same wallet in MetaMask (EVM), the WATTx wallet app/extension
   (WTX), and any BIP39 tool. Keys are derived in-memory and never stored. */
const MG_COINS=[
  {sym:'EVM', name:'POL · ALT · WATT (all EVM chains)', path:"m/44'/60'/0'/0/0",   kind:'evm'},
  {sym:'WTX', name:'WATTx',                             path:"m/44'/22356'/0'/0/0",kind:'p2pkh', ver:73,   wif:201},
  {sym:'HTH', name:'Help The Homeless',                 path:"m/44'/5'/0'/0/0",    kind:'p2pkh', ver:0x64, wif:0xE4},
  {sym:'BITN',name:'Bitnet',                            path:"m/44'/9332'/0'/0/0", kind:'p2pkh', ver:0x19, wif:0x99},
  {sym:'BSV', name:'BSV (WATT-on-BSV payouts)',         path:"m/44'/236'/0'/0/0",  kind:'p2pkh', ver:0x00, wif:0x80},
];
function mgHexB(b){ return Array.from(b,x=>x.toString(16).padStart(2,'0')).join(''); }
function mgB58(bytes){
  const A='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  let n=0n; for(const x of bytes) n=n*256n+BigInt(x);
  let s=''; while(n>0n){ s=A[Number(n%58n)]+s; n/=58n; }
  for(const x of bytes){ if(x===0) s='1'+s; else break; }
  return s;
}
function mgB58check(payload){ /* payload = Uint8Array incl. version byte */
  const { sha256 } = window.__mgKeys;
  const chk=sha256(sha256(payload)).slice(0,4);
  const out=new Uint8Array(payload.length+4); out.set(payload); out.set(chk,payload.length);
  return mgB58(out);
}
function mgEvmAddr(pubUncompressed){
  const { keccak_256 } = window.__mgKeys;
  const raw=mgHexB(keccak_256(pubUncompressed.slice(1)).slice(-20));
  const h=mgHexB(keccak_256(new TextEncoder().encode(raw)));
  let a='0x'; for(let i=0;i<40;i++) a+=parseInt(h[i],16)>=8?raw[i].toUpperCase():raw[i];
  return a;
}
/* Derive every coin's payout wallet from a BIP39 seed phrase.
   withKeys=true adds privKey (EVM hex) / wif (UTXO coins, compressed). */
function mgWalletsFromSeed(mnemonic, withKeys){
  const K=window.__mgKeys, {bip39,HDKey,secp256k1,sha256,ripemd160}=K;
  const m=mnemonic.trim().toLowerCase().split(/\s+/).join(' ');
  if(!bip39.validateMnemonic(m,bip39.wordlist)) throw new Error('Invalid seed phrase — check the words (BIP39 English)');
  const root=HDKey.fromMasterSeed(bip39.mnemonicToSeedSync(m));
  return MG_COINS.map(c=>{
    const node=root.derive(c.path), priv=node.privateKey;
    const out={sym:c.sym,name:c.name,path:c.path};
    if(c.kind==='evm'){
      out.address=mgEvmAddr(secp256k1.getPublicKey(priv,false));
      if(withKeys) out.privKey='0x'+mgHexB(priv);
    } else {
      const pub=secp256k1.getPublicKey(priv,true);          // compressed
      const h160=ripemd160(sha256(pub));
      const p=new Uint8Array(21); p[0]=c.ver; p.set(h160,1);
      out.address=mgB58check(p);
      if(withKeys){                                          // WIF, compressed flag
        const wp=new Uint8Array(34); wp[0]=c.wif; wp.set(priv,1); wp[33]=0x01;
        out.wif=mgB58check(wp);
      }
    }
    return out;
  });
}
function mgNewSeedWallet(){
  const {bip39}=window.__mgKeys;
  const mnemonic=bip39.generateMnemonic(bip39.wordlist,128); // 12 words
  return { mnemonic, wallets:mgWalletsFromSeed(mnemonic) };
}
/* legacy single-key generator (kept for old saves / quick EVM-only wallets) */
function mgGenWallet(){
  const { secp256k1 } = window.__mgKeys;
  const priv=crypto.getRandomValues(new Uint8Array(32));
  let pk; try{ pk=secp256k1.getPublicKey(priv,false); }catch(e){ return mgGenWallet(); } // ~2^-128 invalid-key retry
  return { address:mgEvmAddr(pk), privateKey:'0x'+mgHexB(priv) };
}
