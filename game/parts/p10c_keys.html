/* ---------- payout wallet generation (task: every miner can generate their
   own wallet address for payouts). Key derived locally from
   crypto.getRandomValues; EIP-55 checksummed address; the private key is
   shown ONCE and never stored — only the address goes into the save. */
function mgGenWallet(){
  const { secp256k1, keccak_256 } = window.__mgKeys;
  const priv=crypto.getRandomValues(new Uint8Array(32));
  const hex=b=>Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
  let pk; try{ pk=secp256k1.getPublicKey(priv,false); }catch(e){ return mgGenWallet(); } // ~2^-128 invalid-key retry
  const raw=hex(keccak_256(pk.slice(1)).slice(-20));
  const h=hex(keccak_256(new TextEncoder().encode(raw)));
  let addr='0x';
  for(let i=0;i<40;i++) addr+=parseInt(h[i],16)>=8?raw[i].toUpperCase():raw[i];
  return { address:addr, privateKey:'0x'+hex(priv) };
}
