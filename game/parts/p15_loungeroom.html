<script type="module">
/* ================= LOUNGE ROOM (a real place, not the mining lab) =================
   A game-lobby-styled lounge (neon floor, bar, big screen, doorways for future
   rooms) built as its own region at z≈LZ, far from the mining room. A glowing
   portal in the mining room takes you there (teleport + presence on); a return
   portal brings you back. This module OWNS "entering the lounge": the LOUNGE
   button, key 6, ?lounge, and the lounge host all route through here, and it
   calls MGNET.enter()/leave() for the netcode. */
import * as THREE from 'three';

(() => {
  const UPS = 2.25;
  const MG = () => window.MG;
  const NET = () => window.MGNET;

  // Lounge region — matches p14's furniture LZ.
  const LZ = -120, LX = 0;
  const LW = 30, LD = 24, LH = 6;                 // lobby is roomier than the lab
  const NEON = 0x35e0ff, NEON2 = 0xb14bff, GOLD = 0xffd23f;

  let built = false, room = null, inLounge = false;
  let save = null;                                // cam/target/walkbox to restore on exit
  const portals = [];                             // {mesh, kind:'enter'|'exit'}

  const mat = (c, r = 0.7, e = 0, ei = 0) => {
    const m = new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: 0.15 });
    if (e) { m.emissive = new THREE.Color(e); m.emissiveIntensity = ei || 1; }
    return m;
  };

  // ── build the lounge environment ────────────────────────────────────────────
  function build() {
    if (built) return; const scene = MG().scene; if (!scene) return;
    room = new THREE.Group(); room.position.set(LX, 0, LZ);

    // floor: dark slab + neon grid
    const floor = new THREE.Mesh(new THREE.BoxGeometry(LW, 0.2, LD), mat(0x0c0f1a, 0.9));
    floor.position.y = -0.1; room.add(floor);
    const grid = new THREE.GridHelper(Math.max(LW, LD), 20, NEON, 0x1b2740);
    grid.position.y = 0.02; grid.material.opacity = 0.35; grid.material.transparent = true; room.add(grid);

    // walls (thin, dark) + neon top strip
    const wallMat = mat(0x11131f, 0.85);
    const mkWall = (w, h, x, z, ry) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.3), wallMat); m.position.set(x, h / 2, z); m.rotation.y = ry; room.add(m);
      const strip = new THREE.Mesh(new THREE.BoxGeometry(w, 0.12, 0.34), mat(NEON, 0.4, NEON, 1.4)); strip.position.set(x, h - 0.4, z); strip.rotation.y = ry; room.add(strip); };
    mkWall(LW, LH, 0, -LD / 2, 0);                 // back
    mkWall(LD, LH, -LW / 2, 0, Math.PI / 2);        // left
    mkWall(LD, LH, LW / 2, 0, Math.PI / 2);         // right
    // front wall is open (that's where you arrive), just corner posts
    [[-LW / 2, LD / 2], [LW / 2, LD / 2]].forEach(([x, z]) => { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, LH, 8), mat(0x11131f, 0.7, NEON2, 0.5)); p.position.set(x, LH / 2, z); room.add(p); });

    // ceiling with a soft glow panel
    const ceil = new THREE.Mesh(new THREE.BoxGeometry(LW, 0.2, LD), mat(0x0a0c15, 0.9)); ceil.position.y = LH; room.add(ceil);
    const glow = new THREE.Mesh(new THREE.PlaneGeometry(LW * 0.5, LD * 0.5), mat(0x101828, 1, 0x223, 0.4)); glow.rotation.x = Math.PI / 2; glow.position.y = LH - 0.11; room.add(glow);
    room.add(new THREE.PointLight(NEON, 0.6, 40).translateY(LH - 1));
    room.add(new THREE.PointLight(NEON2, 0.4, 40));
    room.add(new THREE.AmbientLight(0x404a66, 0.7));

    // BIG SCREEN on the back wall
    const screen = new THREE.Mesh(new THREE.PlaneGeometry(10, 5.4), mat(0x050810, 0.4, 0x0a1830, 1.2));
    screen.position.set(0, 3.2, -LD / 2 + 0.2); room.add(screen);
    const bezel = new THREE.Mesh(new THREE.BoxGeometry(10.6, 6, 0.2), mat(0x05070d, 0.5, NEON, 0.6)); bezel.position.set(0, 3.2, -LD / 2 + 0.1); room.add(bezel);
    // marquee text via canvas
    const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 512; const cx = cv.getContext('2d');
    cx.fillStyle = '#050810'; cx.fillRect(0, 0, 1024, 512);
    cx.fillStyle = '#35e0ff'; cx.font = 'bold 90px system-ui'; cx.textAlign = 'center'; cx.fillText('THE LOUNGE', 512, 210);
    cx.fillStyle = '#ffd23f'; cx.font = 'bold 44px system-ui'; cx.fillText('WATTxchange', 512, 300);
    cx.fillStyle = '#8b94ab'; cx.font = '34px system-ui'; cx.fillText('drag chairs · sit · talk · voice', 512, 380);
    const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; screen.material.map = tex; screen.material.emissiveMap = tex; screen.material.needsUpdate = true;

    // BAR counter along the left wall
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.2, 8), mat(0x1a1330, 0.6, NEON2, 0.5)); bar.position.set(-LW / 2 + 1.2, 0.6, -2); room.add(bar);
    const barTop = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.12, 8.2), mat(0x2a2050, 0.4, GOLD, 0.5)); barTop.position.set(-LW / 2 + 1.2, 1.26, -2); room.add(barTop);

    // DOORWAYS for future rooms (labeled placeholders) on the right wall
    ['POKER', 'ARCADE', 'STAGE'].forEach((label, i) => {
      const z = -6 + i * 6;
      const frame = new THREE.Mesh(new THREE.BoxGeometry(0.3, 3.4, 2.4), mat(0x14182a, 0.6, GOLD, 0.35)); frame.position.set(LW / 2 - 0.2, 1.7, z); room.add(frame);
      const dc = document.createElement('canvas'); dc.width = 256; dc.height = 64; const dx = dc.getContext('2d');
      dx.fillStyle = 'rgba(6,8,14,0.9)'; dx.fillRect(0, 0, 256, 64); dx.fillStyle = '#ffd23f'; dx.font = 'bold 34px system-ui'; dx.textAlign = 'center'; dx.textBaseline = 'middle'; dx.fillText(label + ' · soon', 128, 34);
      const dt = new THREE.CanvasTexture(dc); dt.colorSpace = THREE.SRGBColorSpace;
      const sign = new THREE.Sprite(new THREE.SpriteMaterial({ map: dt, transparent: true })); sign.scale.set(2.4, 0.6, 1); sign.position.set(LW / 2 - 0.6, 3.3, z); room.add(sign);
    });

    // RETURN portal (near the open front edge)
    const rp = makePortal('↩ MINING ROOM', 0xff7a3c);
    rp.position.set(0, 0, LD / 2 - 1.5); room.add(rp);
    portals.push({ mesh: rp, kind: 'exit' });

    room.visible = false;
    scene.add(room);
    built = true;

    // ENTER portal in the MINING room (world coords, added straight to scene)
    const ep = makePortal('🛋 THE LOUNGE', NEON);
    ep.position.set(0, 0, 11.4);                   // the open +z side of the mining room
    scene.add(ep);
    portals.push({ mesh: ep, kind: 'enter' });
  }

  function makePortal(label, color) {
    const g = new THREE.Group();
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.14, 12, 32), mat(0x101828, 0.4, color, 1.6));
    ring.position.y = 1.6; ring.rotation.x = 0; g.add(ring);
    const veil = new THREE.Mesh(new THREE.CircleGeometry(1.3, 32), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.18, side: THREE.DoubleSide }));
    veil.position.y = 1.6; g.add(veil);
    g.add(new THREE.PointLight(color, 0.8, 10).translateY(1.6));
    const cv = document.createElement('canvas'); cv.width = 512; cv.height = 96; const cx = cv.getContext('2d');
    cx.fillStyle = 'rgba(6,8,14,0.85)'; cx.beginPath(); cx.roundRect(20, 18, 472, 60, 14); cx.fill();
    cx.fillStyle = '#e8ecf6'; cx.font = 'bold 44px system-ui'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(label, 256, 50);
    const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
    const sign = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false })); sign.scale.set(3.2, 0.6, 1); sign.position.y = 3.3; sign.renderOrder = 998; g.add(sign);
    g.userData.portal = true; g.userData.ring = ring;
    return g;
  }

  // ── enter / exit ─────────────────────────────────────────────────────────────
  function enterLounge() {
    if (inLounge) return;
    build(); if (!built) return;
    const cam = MG().cam, controls = MG().controls;
    save = { pos: cam.position.clone(), tgt: controls.target.clone(),
      box: { x: MG().WALKBOX.x, zMin: MG().WALKBOX.zMin, zMax: MG().WALKBOX.zMax } };
    room.visible = true;
    // teleport into the lounge, facing the big screen
    cam.position.set(LX, 4.4, LZ + LD / 2 - 3);
    controls.target.set(LX, 1.6, LZ);
    controls.enabled = true;
    // re-bound the walk clamp to the lounge footprint
    MG().WALKBOX.x = LW / 2 - 0.6; MG().WALKBOX.zMin = LZ - LD / 2 + 0.6; MG().WALKBOX.zMax = LZ + LD / 2 - 0.6;
    inLounge = true;
    NET() && NET().enter && NET().enter();         // presence + furniture + voice
    updateButton();
  }
  function exitLounge() {
    if (!inLounge) return;
    NET() && NET().leave && NET().leave();
    const cam = MG().cam, controls = MG().controls;
    if (room) room.visible = false;
    if (save) {
      cam.position.copy(save.pos); controls.target.copy(save.tgt);
      MG().WALKBOX.x = save.box.x; MG().WALKBOX.zMin = save.box.zMin; MG().WALKBOX.zMax = save.box.zMax;
    }
    controls.enabled = true;
    inLounge = false;
    updateButton();
  }
  function toggle() { inLounge ? exitLounge() : enterLounge(); }

  function updateButton() {
    const b = document.getElementById('b-lounge'); if (!b) return;
    b.textContent = inLounge ? '🛋 LEAVE' : '🛋 LOUNGE';
    b.classList.toggle('accent', inLounge);
  }

  // ── portal interaction: proximity prompt + click ────────────────────────────
  const ray = new THREE.Raycaster();
  function worldPos(mesh) { return mesh.getWorldPosition(new THREE.Vector3()); }
  function onDown(ev) {
    if (!built) return;
    const canvas = MG().controls.domElement;
    const r = canvas.getBoundingClientRect();
    const nd = new THREE.Vector2(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(nd, MG().cam);
    for (const p of portals) {
      if (p.kind === 'enter' && inLounge) continue;
      if (p.kind === 'exit' && !inLounge) continue;
      if (ray.intersectObject(p.mesh, true).length) {
        ev.stopImmediatePropagation(); ev.preventDefault();
        p.kind === 'enter' ? enterLounge() : exitLounge();
        return;
      }
    }
  }

  // spin portal rings + proximity auto-prompt/enter
  let prompt;
  function tick() {
    requestAnimationFrame(tick);
    if (!built) return;
    const cam = MG().cam; let near = null;
    for (const p of portals) {
      p.mesh.userData.ring.rotation.z += 0.02;
      const active = (p.kind === 'enter') ? !inLounge : inLounge;
      p.mesh.visible = active;
      if (!active) continue;
      const d = cam.position.distanceTo(worldPos(p.mesh));
      if (d < 2.4) near = p;
    }
    if (prompt) prompt.style.display = near ? 'block' : 'none';
    if (near) prompt.textContent = near.kind === 'enter' ? '🛋 click the portal to enter The Lounge' : '↩ click the portal to return to your mining room';
  }

  // ── boot ─────────────────────────────────────────────────────────────────────
  (function boot(t = 0) {
    if (MG() && MG().scene && MG().controls && NET()) {
      build();
      const canvas = MG().controls.domElement;
      canvas.addEventListener('pointerdown', onDown, true);
      // own the LOUNGE button + key 6
      const b = document.getElementById('b-lounge'); if (b) b.onclick = () => toggle();
      window.addEventListener('keydown', (e) => { if (e.key === '6') { e.stopPropagation(); toggle(); } }, true);
      // floating prompt
      prompt = document.createElement('div');
      prompt.style.cssText = 'position:fixed;left:50%;top:64%;transform:translateX(-50%);z-index:55;display:none;background:rgba(12,16,26,0.9);border:1px solid #35e0ff55;border-radius:10px;color:#e8ecf6;padding:8px 16px;font:600 13px system-ui;pointer-events:none';
      document.body.appendChild(prompt);
      requestAnimationFrame(tick);
      // auto-enter on the lounge host / ?lounge
      const q = new URLSearchParams(location.search);
      if (q.has('lounge') || (location.hostname === 'lounge.wattxchange.app' && !q.has('solo'))) {
        // wait for the splash to be dismissed before teleporting
        const w = setInterval(() => { const sp = document.getElementById('splash'); if (sp && getComputedStyle(sp).display === 'none') { clearInterval(w); enterLounge(); } }, 200);
        setTimeout(() => clearInterval(w), 60000);
      }
      window.MGLOUNGE = { enter: enterLounge, exit: exitLounge, toggle };
      return;
    }
    if (t > 250) return;
    setTimeout(() => boot(t + 1), 100);
  })();
})();
</script>
