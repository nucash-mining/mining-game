/* number formatting */
function fmt(n){ n=Number(n)||0; const a=Math.abs(n);
  if(a>=1e9) return (n/1e9).toFixed(2)+'B'; if(a>=1e6) return (n/1e6).toFixed(2)+'M';
  if(a>=1e4) return (n/1e3).toFixed(1)+'k'; if(a>=100) return Math.floor(n).toString();
  if(a>=10) return n.toFixed(1); return n.toFixed(2); }
function fmtInt(n){ n=Number(n)||0; if(n>=1e6) return (n/1e6).toFixed(2)+'M'; if(n>=1e4) return (n/1e3).toFixed(1)+'k'; return Math.floor(n).toString(); }

/* derived stats */
function ocHashMult(r){ const o=r.oc||{c:0,m:0}; return 1 + o.c*0.05 + o.m*0.02; }
function ocWattMult(r){ const o=r.oc||{c:0,m:0}; return 1 + o.c*0.07 + o.m*0.03; }
function ocRiskPerMin(r){ const o=r.oc||{c:0,m:0}, s=o.c+o.m; if(!s) return 0;
  const base=s*s*0.0015; return base*(S&&S.temp>=100?12:S&&S.temp>=85?4:1); }
function rigHash(r){ if(r.crashT>0||!r.on||r.wear>=100) return 0;
  let h=ITEMS[1].hash; if(r.cpu) h+=ITEMS[r.cpu].hash; if(r.asic) h+=ITEMS[r.asic].hash; for(const g of r.gpus) h+=ITEMS[g].hash; return h*ocHashMult(r)*(1-0.5*(r.wear||0)/100); }
function rigWatt(r){ if(!r.on) return 0; let w=ITEMS[1].watt; if(r.cpu) w+=ITEMS[r.cpu].watt; if(r.asic) w+=ITEMS[r.asic].watt; for(const g of r.gpus) w+=ITEMS[g].watt;
  return (r.crashT>0||r.wear>=100) ? w*0.25 : w*ocWattMult(r); }
function rigSW(r){ let s=ITEMS[1].sw; if(r.cpu) s+=ITEMS[r.cpu].sw; if(r.asic) s+=ITEMS[r.asic].sw; if(r.frame) s+=ITEMS[14].sw; for(const g of r.gpus) s+=ITEMS[g].sw; return s; }
function gpuCap(r){ return r.frame?4:2; }
function totHash(){ return S.rigs.reduce((a,r)=>a+rigHash(r),0) * Math.pow(CFG.gen2Mult,S.gen-1); }
function totWatt(){ return S.rigs.reduce((a,r)=>a+rigWatt(r),0); }
function totSW(){ return S.rigs.reduce((a,r)=>a+rigSW(r),0) + (S.badge?ITEMS[2].sw:0) + (S.tower?ITEMS[19].sw:0); }
function totSWStake(){ return S.rigs.reduce((a,r)=>a+rigSW(r)*(r.on?0.25:1),0) + (S.badge?ITEMS[2].sw:0) + (S.tower?ITEMS[19].sw:0); }
function rigValue(r){ let v=ITEMS[1].price; if(r.cpu) v+=ITEMS[r.cpu].price; if(r.asic) v+=ITEMS[r.asic].price; if(r.frame) v+=ITEMS[14].price; for(const g of r.gpus) v+=ITEMS[g].price; return v; }
function repairCost(r){ return Math.ceil(rigValue(r)*0.18*(r.wear||0)/100); }
function stakeMult(){ return S.tower?CFG.towerStakeMult:1; }
function powerCap(){ return CFG.powerBase + S.upg.power*CFG.powerPerLvl; }
function eligibleSlots(){ const out=[];
  for(let i=0;i<3+S.upg.rack*3;i++) out.push(i);                       // garage desks
  for(let i=0;i<S.containers*6;i++) out.push(9+i);                     // container racks
  if(S.warehouse) for(let i=0;i<12;i++) out.push(21+i);                // warehouse racks
  return out; }
function slotCount(){ return eligibleSlots().length; }
function periphCount(){ return (S.periph[17]?1:0)+(S.periph[18]?1:0)+(S.periph[23]?1:0); }
function luckMult(){ const pc=periphCount(); return 1 + (S.badge?0.10:0) + pc*0.02 + (pc===3?0.03:0) + (S.chair?0.03:0); }
function effMult(){ return S.badge?0.90:1; }
function pcPrice(){ return Math.round(CFG.pcBasePrice*Math.pow(CFG.pcPriceGrowth,Math.max(0,S.pcCount-1))); }
function difficulty(){ return 1 + S.blocks/CFG.diffSoft; }
function powerFactor(){ const d=totWatt(); return d<=powerCap()?1:powerCap()/d; }
function tempTarget(){ return 24 + totWatt()*CFG.coolBase*(1-S.upg.cooling*CFG.coolPerLvl); }
function heatFactor(){ return S.temp>=100?0.25 : S.temp>=85?0.6 : 1; }
function farmStatus(){ return S.warehouse?'ELITE':S.containers?'PRO':'GARAGE'; }
function netWorth(){ return S.watt + S.stakedWatt + S.usdt + S.dai + (S.pol+S.pend.pol)*S.price.pol + (S.alt+S.pend.alt+S.altLocked)*S.price.alt + (S.wtx+S.pend.wtx)*S.price.wtx; }
